apply plugin: 'com.android.library'
android {
    namespace 'com.billy.cc'
    compileSdk 34
    defaultConfig {
        minSdk 8
        targetSdk 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    api project(':pools')
    compileOnly 'androidx.appcompat:appcompat:1.1.0'
}
